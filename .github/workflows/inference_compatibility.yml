name: Inference compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Validate every supported Python version
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_matrix:
        description: Validate every supported Python version
        type: boolean
        default: true
      export_sdist:
        description: Export the validated source distribution
        type: boolean
        default: false
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (inputs.full_matrix || github.event_name == 'schedule') && 'full' || 'daily' }}-${{ (github.event_name == 'push' && github.ref_type == 'branch' || github.event_name == 'pull_request') && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' || github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.scope.outputs.core }}
      python_tags: ${{ steps.scope.outputs.python_tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select validation scope
        id: scope
        env:
          HOTPOT_CI_FULL_MATRIX: ${{ inputs.full_matrix || github.event_name == 'schedule' }}
        run: python .github/scripts/ci_scope.py

  native-wheel:
    needs: scope
    if: ${{ needs.scope.outputs.core == 'true' }}
    uses: ./.github/workflows/native_wheels.yml
    with:
      python-tags: ${{ needs.scope.outputs.python_tags }}

  cpu-inference:
    needs: [scope, package-smoke]
    if: ${{ needs.scope.outputs.core == 'true' && needs.scope.outputs.python_tags != '["cp311"]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            python-tag: cp310
          - python-version: "3.12"
            python-tag: cp312
          - python-version: "3.13"
            python-tag: cp313
          - python-version: "3.14"
            python-tag: cp314

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/operations/inference/artifacts/data/mca/manifest.json', 'hotpot/cheminfo/operations/inference/artifacts/data/cbond/manifest.json') }}
      - name: Download the wheel built for this Python
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.python-tag }}
          path: wheelhouse
      - name: Install compatibility runner
        run: python -m pip install uv
      - name: Test maintained inference and graph-search matrix
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_TEST_WORKDIR: ${{ runner.temp }}/hotpot-tests
        run: |
          HOTPOT_TEST_WHEEL=$(find wheelhouse -name '*.whl' -print -quit)
          export HOTPOT_TEST_WHEEL
          mkdir -p "$HOTPOT_TEST_WORKDIR"
          ./tests/run_inference_compatibility.sh "${{ matrix.python-version }}"

  package-smoke:
    needs: [scope, native-wheel]
    if: ${{ needs.scope.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/operations/inference/artifacts/data/mca/manifest.json', 'hotpot/cheminfo/operations/inference/artifacts/data/cbond/manifest.json') }}
      - name: Download the CPython 3.11 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-cp311
          path: wheelhouse
      - name: Install build and inference dependencies
        run: python -m pip install build -r tests/requirements-inference.txt
      - name: Build distributions and install wheel
        run: |
          python -m build --sdist
          python tests/test_packaging/audit_sdist.py dist/*.tar.gz
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
      - name: Install and verify inference models
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all
      - name: Smoke-test installed core and documentation
        working-directory: /tmp
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          core
      - name: Smoke-test installed MCA inference
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          mca
      - name: Smoke-test installed CBond inference
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          cbond
      - name: Smoke-test installed force-field workflows
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          forcefield

      - name: Upload validated source distribution
        if: ${{ inputs.export_sdist }}
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  coverage:
    needs: package-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/operations/inference/artifacts/data/mca/manifest.json', 'hotpot/cheminfo/operations/inference/artifacts/data/cbond/manifest.json') }}
      - name: Download the CPython 3.11 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-cp311
          path: wheelhouse
      - name: Install the tested wheel and coverage dependencies
        run: |
          python -m pip install 'coverage>=7,<8' -r tests/requirements-inference.txt
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
          python -m pip check
      - name: Install and verify inference models
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all
      - name: Run maintained tests with coverage
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
          HOTPOT_RUN_MODEL_ARTIFACT_TESTS: "1"
          HOTPOT_TEST_INSTALLED_PACKAGE: "1"
          HOTPOT_TEST_WORKDIR: ${{ runner.temp }}/hotpot-tests
        run: ./tests/run_coverage.sh
      - name: Annotate test failures
        if: ${{ failure() && hashFiles('tests/coverage/junit.xml') != '' }}
        run: python tests/annotate_junit.py tests/coverage/junit.xml
      - name: Upload coverage reports to Codecov
        if: ${{ always() && hashFiles('tests/coverage/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./tests/coverage/coverage.xml
          use_oidc: true

  doc-check:
    needs: scope
    if: ${{ needs.scope.outputs.core == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install workflow test runner
        run: python -m pip install pytest
      - name: Check documentation validation routing
        run: >-
          python -m pytest -q --confcutdir=tests/test_packaging
          tests/test_packaging/test_github_workflows.py
          tests/test_packaging/test_ci_scope.py
