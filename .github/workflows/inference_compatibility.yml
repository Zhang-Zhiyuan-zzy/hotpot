name: Inference compatibility

on:
  pull_request:
    paths:
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/cheminfo/calculator.py"
      - "hotpot/calculator.py"
      - "hotpot/__init__.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  push:
    paths:
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/cheminfo/calculator.py"
      - "hotpot/calculator.py"
      - "hotpot/__init__.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  workflow_dispatch:

jobs:
  cpu-inference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install inference dependencies
        run: python -m pip install -r tests/requirements-inference.txt
      - name: Test inference and graph-search integration
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/mca tests/cbond
          tests/test_cheminfo/test_mca_calculator.py
          tests/test_cheminfo/test_molecule_conversion.py
          tests/test_cheminfo/test_ob2chem_compat.py
          tests/test_cheminfo/test_bond_metadata.py
          tests/test_cheminfo/test_ligand_rings.py
          tests/test_cheminfo/test_search.py
          tests/test_cheminfo/test_search_mapping.py
          tests/test_cheminfo/test_smarts.py
          tests/test_smart_parser.py
      - name: Test strict SMARTS and coordination contracts
        run: >-
          python -m pytest -q -p no:cacheprovider
          -m smarts_core tests/smarts_conformance

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and inference dependencies
        run: python -m pip install build -r tests/requirements-inference.txt
      - name: Build and install wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Smoke-test installed package outside the checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          import hotpot
          from hotpot.cheminfo.AImodels.mca import MCAPredictor

          molecule = hotpot.to_hotpot_mol("C1CCCCN1")
          prediction = MCAPredictor(device="cpu").predict(molecule)
          assert len(prediction.atom_predictions) == 6
          assert abs(prediction.sites[0].mca_kj_mol - 503.25) < 1e-6
          PY
