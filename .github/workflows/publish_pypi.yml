name: Build and optionally publish Python distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish through the configured PyPI Trusted Publisher
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match a release tag to the project version
        if: ${{ github.ref_type == 'tag' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          PY

  validation:
    name: Validate release distributions and business matrix
    needs: release-metadata
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/inference_compatibility.yml
    with:
      full_matrix: true
      export_sdist: true

  publish:
    name: Publish to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: validation
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hotpot-zzy
    permissions:
      id-token: write
    steps:
      - name: Download validated wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Download validated source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
