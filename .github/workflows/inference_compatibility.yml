name: Inference compatibility

on:
  pull_request:
    paths:
      - "README.md"
      - "hotpot/cheminfo/AImodels/artifacts/**"
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/calculator/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/forcefields/**"
      - "hotpot/cheminfo/geometry/**"
      - "hotpot/cheminfo/graph/**"
      - "hotpot/cheminfo/obWrappers/**"
      - "hotpot/works/convert.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/pipeline/**"
      - "hotpot/plugins/_harness/**"
      - "hotpot/plugins/xtb/**"
      - "hotpot/__init__.py"
      - "hotpot/__main__.py"
      - "hotpot/_cli.py"
      - "hotpot/utils/configs/logging_config.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/calculator/**"
      - "tests/test_cheminfo/test_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_geometry*.py"
      - "tests/test_cheminfo/geometry/**"
      - "tests/test_cheminfo/graph/**"
      - "tests/test_cheminfo/obWrappers/**"
      - "tests/test_cheminfo/test_forcefield*.py"
      - "tests/test_cheminfo/test_complex*.py"
      - "tests/test_cheminfo/test_topology_determinism.py"
      - "tests/test_works/**"
      - "tests/test_cli/test_run_cli.py"
      - "tests/test_cli/test_xtb_cli.py"
      - "tests/test_main/test_command_loading.py"
      - "tests/test_pipeline/**"
      - "tests/test_plugin/test_harness/**"
      - "tests/test_plugin/test_xtb/**"
      - "tests/benchmarks/coordination_complexes/**"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "tests/run_coverage.sh"
      - "tests/readme/test_readme_examples.py"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  push:
    branches:
      - "**"
    paths:
      - "README.md"
      - "hotpot/cheminfo/AImodels/artifacts/**"
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/calculator/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/forcefields/**"
      - "hotpot/cheminfo/geometry/**"
      - "hotpot/cheminfo/graph/**"
      - "hotpot/cheminfo/obWrappers/**"
      - "hotpot/works/convert.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/pipeline/**"
      - "hotpot/plugins/_harness/**"
      - "hotpot/plugins/xtb/**"
      - "hotpot/__init__.py"
      - "hotpot/__main__.py"
      - "hotpot/_cli.py"
      - "hotpot/utils/configs/logging_config.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/calculator/**"
      - "tests/test_cheminfo/test_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_geometry*.py"
      - "tests/test_cheminfo/geometry/**"
      - "tests/test_cheminfo/graph/**"
      - "tests/test_cheminfo/obWrappers/**"
      - "tests/test_cheminfo/test_forcefield*.py"
      - "tests/test_cheminfo/test_complex*.py"
      - "tests/test_cheminfo/test_topology_determinism.py"
      - "tests/test_works/**"
      - "tests/test_cli/test_run_cli.py"
      - "tests/test_cli/test_xtb_cli.py"
      - "tests/test_main/test_command_loading.py"
      - "tests/test_pipeline/**"
      - "tests/test_plugin/test_harness/**"
      - "tests/test_plugin/test_xtb/**"
      - "tests/benchmarks/coordination_complexes/**"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "tests/run_coverage.sh"
      - "tests/readme/test_readme_examples.py"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-inference:
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            python-tag: cp310
          - python-version: "3.11"
            python-tag: cp311
          - python-version: "3.12"
            python-tag: cp312
          - python-version: "3.13"
            python-tag: cp313
          - python-version: "3.14"
            python-tag: cp314

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}
      - name: Download the wheel built for this Python
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.python-tag }}
          path: wheelhouse
      - name: Install compatibility runner
        run: python -m pip install uv
      - name: Test maintained inference and graph-search matrix
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_TEST_WORKDIR: ${{ runner.temp }}/hotpot-tests
        run: |
          HOTPOT_TEST_WHEEL=$(find wheelhouse -name '*.whl' -print -quit)
          export HOTPOT_TEST_WHEEL
          mkdir -p "$HOTPOT_TEST_WORKDIR"
          ./tests/run_inference_compatibility.sh "${{ matrix.python-version }}"

  native-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-tag: [cp310, cp311, cp312, cp313, cp314]

    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test the native wheel
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BUILD: ${{ matrix.python-tag }}-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: >-
            quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
          CIBW_CONTAINER_ENGINE: >-
            docker; disable_host_mount: true
          CIBW_ENVIRONMENT_LINUX: >-
            HOTPOT_RDWRAPPERS_BUILD_PROFILE=manylinux_2_28_x86_64
            HOTPOT_RDKIT_SOURCE_CACHE=/tmp/hotpot-rdkit-source-cache
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --exclude libopenbabel.so.7
            --exclude libopenbabel.so.8
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >-
            python -c "import hotpot;
            from hotpot.cheminfo.geometry import _geometry_native;
            from hotpot.cheminfo.graph import GraphSpectrum, relevant_cycles;
            from hotpot.cheminfo.search import _search_native;
            from hotpot.cheminfo.obWrappers import _ob_native;
            from hotpot.cheminfo import rdWrappers;
            assert GraphSpectrum is not None;
            assert _geometry_native is not None and _ob_native is not None;
            assert _search_native.NativeProblem is not None;
            assert tuple(h.atom_indices for h in hotpot.read_mol('CCO', 'smi').search_substructure('[C]-[O]')) == (frozenset((1, 2)),);
            assert relevant_cycles([(4, 7), (7, 9), (9, 4)]) == ((4, 7, 9),);
            info = rdWrappers.runtime_info();
            assert info.native and info.rdkit_version == '2026.09.1'"
      - name: Audit wheel contents
        run: python tests/test_packaging/audit_rdwrapper_wheel.py wheelhouse/*.whl
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python-tag }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  package-smoke:
    needs: native-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}
      - name: Download the CPython 3.11 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-cp311
          path: wheelhouse
      - name: Install build and inference dependencies
        run: python -m pip install build -r tests/requirements-inference.txt
      - name: Build distributions and install wheel
        run: |
          python -m build --sdist
          python - <<'PY'
          from pathlib import Path
          import tarfile

          expected = {
              "hotpot/_cli.py",
              "hotpot/pipeline/cli.py",
              "hotpot/pipeline/cli_doc.md",
              "hotpot/cheminfo/forcefields/cli.py",
              "hotpot/cheminfo/forcefields/cli_doc.md",
              "hotpot/cheminfo/forcefields/__init__.py",
              "hotpot/cheminfo/forcefields/ff.py",
              "hotpot/cheminfo/calculator/execution_selection.py",
              "hotpot/cheminfo/calculator/state_rules/data/profiles/coordination_screening_v1.json",
              "hotpot/cheminfo/search/_search_native.pyi",
              "hotpot/cheminfo/graph/_graph_native.pyi",
              "hotpot/cheminfo/graph/_native/graph.cpp",
              "hotpot/cheminfo/graph/_native/graph.hpp",
              "hotpot/cheminfo/graph/_native/cycle_basis.cpp",
              "hotpot/cheminfo/graph/_native/cycle_basis.hpp",
              "hotpot/cheminfo/search/_native/bindings.cpp",
              "hotpot/cheminfo/search/_native/compatibility.hpp",
              "hotpot/cheminfo/search/_native/matcher.cpp",
              "hotpot/cheminfo/search/_native/matcher.hpp",
              "hotpot/cheminfo/search/_native/production.cpp",
              "hotpot/cheminfo/search/_native/production.hpp",
              "hotpot/plugins/xtb/cli.py",
              "hotpot/plugins/xtb/cli_doc.md",
              "hotpot/plugins/xtb/README.md",
              "hotpot/plugins/xtb/stage.py",
              "hotpot/plugins/xtb/workflow.py",
              "hotpot/pipeline/README.md",
              "hotpot/pipeline/state_recovery.py",
          }
          obsolete = {
              "hotpot/cheminfo/forcefields/ff39.py",
              "hotpot/cheminfo/forcefields/utils.py",
              "hotpot/cheminfo/forcefields/utils39.py",
              "hotpot/cheminfo/_io/xtb.py",
              "hotpot/plugins/xtb/core.py",
              "hotpot/plugins/xtb/xtb_doc.md",
              "hotpot/cheminfo/search/_native/graph_data.cpp",
              "hotpot/cheminfo/search/_native/graph_data.hpp",
          }
          (sdist,) = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              members = {
                  "/".join(Path(name).parts[1:])
                  for name in archive.getnames()
              }
          assert expected <= members
          assert obsolete.isdisjoint(members)
          PY
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
      - name: Install and verify inference models
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all
      - name: Smoke-test installed package outside the checkout
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: |
          python - <<'PY'
          from importlib.resources import files
          import subprocess

          import hotpot
          from hotpot.cheminfo.AImodels.mca import MCAPredictor
          from hotpot.cheminfo.calculator import (
              ScientificOperationRequirements,
              StateRequest,
              extract_molecular_facts,
              resolve_scientific_state,
          )
          from hotpot.cheminfo.calculator.contracts import ScientificQuantity
          from hotpot.cheminfo.calculator.state_selection import StateDecisionAction
          from hotpot.cheminfo.graph import relevant_cycles
          from hotpot.cheminfo.search import _search_native

          assert _search_native.NativeProblem is not None
          assert relevant_cycles([(4, 7), (7, 9), (9, 4)]) == ((4, 7, 9),)
          search_hits = hotpot.read_mol("CCO", "smi").search_substructure("[C]-[O]")
          assert tuple(hit.atom_indices for hit in search_hits) == (
              frozenset({1, 2}),
          )

          facts = extract_molecular_facts(hotpot.read_mol("C", "smi"))
          state = resolve_scientific_state(
              facts,
              StateRequest(net_charge=0, two_s=0),
              requirements=ScientificOperationRequirements(
                  "installed-wheel-smoke",
                  frozenset(
                      {
                          ScientificQuantity.NET_CHARGE,
                          ScientificQuantity.ELECTRONIC_STATE,
                      }
                  ),
                  frozenset(),
              ),
          )
          assert state.execution_decision.action is StateDecisionAction.SELECT_STATE

          forcefield_package = files("hotpot.cheminfo.forcefields")
          assert forcefield_package.joinpath("ff.py").is_file()
          for obsolete_module in ("ff39.py", "utils.py", "utils39.py"):
              assert not forcefield_package.joinpath(obsolete_module).is_file()

          xtb_package = files("hotpot.plugins.xtb")
          assert xtb_package.joinpath("cli_doc.md").is_file()
          xtb_api_documentation = xtb_package.joinpath("README.md").read_text(
              encoding="utf-8"
          )
          assert xtb_api_documentation.startswith("# Hotpot xTB plugin")
          for obsolete_module in ("core.py", "xtb_doc.md", ".cache.json"):
              assert not xtb_package.joinpath(obsolete_module).is_file()

          pipeline_documentation = files("hotpot.pipeline").joinpath(
              "cli_doc.md"
          ).read_text(encoding="utf-8")
          assert pipeline_documentation.startswith("# `hotpot run`")
          pipeline_api_documentation = files("hotpot.pipeline").joinpath(
              "README.md"
          ).read_text(encoding="utf-8")
          assert pipeline_api_documentation.startswith(
              "# Hotpot controlled molecular pipeline"
          )

          geometry_documentation = files("hotpot.cheminfo.geometry").joinpath(
              "README.md"
          ).read_text(encoding="utf-8")
          assert geometry_documentation.startswith(
              "# `hotpot.cheminfo.geometry` API Reference"
          )
          chinese_geometry_documentation = files(
              "hotpot.cheminfo.geometry"
          ).joinpath("README.zh.md").read_text(encoding="utf-8")
          assert chinese_geometry_documentation.startswith(
              "# `hotpot.cheminfo.geometry` API 参考（中文版）"
          )

          documentation = subprocess.run(
              ["hotpot", "mca", "--doc"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "hotpot mca" in documentation
          assert "Command synopsis" in documentation

          xtb_documentation = subprocess.run(
              ["hotpot", "xtb", "--doc"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "hotpot xtb" in xtb_documentation
          assert "Independent methods" in xtb_documentation

          run_documentation = subprocess.run(
              ["hotpot", "run", "--doc"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "hotpot run" in run_documentation
          assert "Results and failure semantics" in run_documentation

          molecule = hotpot.to_hotpot_mol("C1CCCCN1")
          prediction = MCAPredictor(device="cpu").predict(molecule)
          assert len(prediction.atom_predictions) == 6
          assert abs(prediction.sites[0].mca_kj_mol - 503.25) < 1e-6

          cbond_result = subprocess.run(
              ["hotpot", "cbond", "Eu", "CN", "--device", "cpu"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          assert "[Eu" in cbond_result
          assert len(cbond_result.splitlines()) == 1

          pipeline_result = subprocess.run(
              [
                  "hotpot", "ff", "-", "--input-format", "smi",
                  "--epochs", "1", "--steps-per-epoch", "5",
                  "--quality", "off", "--seed", "1", "--timeout", "30",
              ],
              input=f"{cbond_result}\n",
              check=True,
              capture_output=True,
              text=True,
          )
          assert pipeline_result.stdout.startswith("@<TRIPOS>MOLECULE\n")
          assert "@<TRIPOS>ATOM\n" in pipeline_result.stdout
          assert "@<TRIPOS>BOND\n" in pipeline_result.stdout

          cbond_documentation = subprocess.run(
              ["hotpot", "cbond", "--doc"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "hotpot cbond" in cbond_documentation
          assert "Enumerate terminal coordination structures" in cbond_documentation
          assert "default mode must not be interpreted as an alias for Rank 1" in cbond_documentation

          forcefield_documentation = subprocess.run(
              ["hotpot", "ff", "--doc"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "hotpot ff" in forcefield_documentation
          assert "Standard input and pipelines" in forcefield_documentation

          forcefield_result = subprocess.run(
              [
                  "hotpot", "ff", "CC", "--epochs", "1",
                  "--steps-per-epoch", "5", "--quality", "off",
                  "--seed", "1", "--timeout", "30",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          assert forcefield_result.stdout.startswith("@<TRIPOS>MOLECULE\n")
          assert "@<TRIPOS>ATOM\n" in forcefield_result.stdout
          assert "@<TRIPOS>BOND\n" in forcefield_result.stdout

          cbond_ranked = subprocess.run(
              [
                  "hotpot", "cbond", "Eu", "CN", "--device", "cpu",
                  "--all-structures", "--bond-detail",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "Rank 1: Prob:" in cbond_ranked
          assert "Cbond Detail:" in cbond_ranked
          assert cbond_ranked.rstrip().endswith("-- End --")
          PY

  coverage:
    needs: package-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}
      - name: Download the CPython 3.11 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-cp311
          path: wheelhouse
      - name: Install the tested wheel and coverage dependencies
        run: |
          python -m pip install 'coverage>=7,<8' -r tests/requirements-inference.txt
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
          python -m pip check
      - name: Install and verify inference models
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all
      - name: Run maintained tests with coverage
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
          HOTPOT_TEST_WORKDIR: ${{ runner.temp }}/hotpot-tests
        run: ./tests/run_coverage.sh
      - name: Annotate test failures
        if: ${{ failure() && hashFiles('tests/coverage/junit.xml') != '' }}
        run: python tests/annotate_junit.py tests/coverage/junit.xml
      - name: Upload coverage reports to Codecov
        if: ${{ always() && hashFiles('tests/coverage/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./tests/coverage/coverage.xml
          use_oidc: true
