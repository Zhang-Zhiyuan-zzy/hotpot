name: Tests and coverage

on:
  - push
  - pull_request

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: To workdir
        uses: actions/checkout@v7

      - name: Cache conda
        uses: actions/cache@v6
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml', 'pyproject.toml') }}

      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}

      - name: Set up conda-env
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: hp
          auto-activate: false
          auto-update-conda: false
          environment-file: environment.yml
          use-only-tar-bz2: true
          pkgs-dirs: ~/conda_pkgs_dir

      - run: |
          conda info
          conda list
        working-directory: ${{ github.workspace }}

      - name: Install and verify inference models
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all

      - name: Run maintained tests with coverage
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: ./tests/run_coverage.sh

      - name: Upload coverage reports to Codecov
        if: ${{ always() && hashFiles('tests/coverage/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./tests/coverage/coverage.xml
          use_oidc: true
