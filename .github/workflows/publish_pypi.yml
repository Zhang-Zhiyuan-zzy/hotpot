name: Build and optionally publish Python distributions

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish through the configured PyPI Trusted Publisher
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "third_party/rdkit/**"
      - "hotpot/cheminfo/rdWrappers/**"
      - "hotpot/cheminfo/geometry/_native/**"
      - "hotpot/cheminfo/graph/_native/**"
      - "hotpot/cheminfo/search/_native/**"
      - "hotpot/cheminfo/forcefields/_native/**"
      - "hotpot/cheminfo/obWrappers/_native/**"
      - "tests/test_packaging/**"
      - ".github/workflows/publish_pypi.yml"

permissions:
  contents: read

jobs:
  release-metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match a release tag to the project version
        if: ${{ github.ref_type == 'tag' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}"
          PY

  wheels:
    name: Wheel ${{ matrix.python-tag }} / manylinux x86-64
    needs: release-metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-tag: [cp310, cp311, cp312, cp313, cp314]

    steps:
      - uses: actions/checkout@v7
      - name: Build and test wheel
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BUILD: ${{ matrix.python-tag }}-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: >-
            quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
          CIBW_CONTAINER_ENGINE: >-
            docker; disable_host_mount: true
          CIBW_ENVIRONMENT_LINUX: >-
            HOTPOT_RDWRAPPERS_BUILD_PROFILE=manylinux_2_28_x86_64
            HOTPOT_RDKIT_SOURCE_CACHE=/tmp/hotpot-rdkit-source-cache
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --exclude libopenbabel.so.7
            --exclude libopenbabel.so.8
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >-
            python -c "import hotpot;
            from hotpot.cheminfo.geometry import _geometry_native;
            from hotpot.cheminfo.graph import _graph_native, relevant_cycles;
            from hotpot.cheminfo.search import _search_native;
            from hotpot.cheminfo.obWrappers import _ob_native;
            from hotpot.cheminfo import rdWrappers;
            from rdkit import Chem;
            assert _graph_native.cycle_basis is not None;
            assert _search_native.NativeProblem is not None;
            assert Chem.MolFromSmiles('CCO').GetNumAtoms() == 3;
            assert tuple(h.atom_indices for h in hotpot.read_mol('CCO', 'smi').search_substructure('[C]-[O]')) == (frozenset((1, 2)),);
            assert relevant_cycles([(4, 7), (7, 9), (9, 4)]) == ((4, 7, 9),);
            info = rdWrappers.runtime_info();
            assert info.native and info.rdkit_version == '2026.09.1';
            sample = rdWrappers.generate_conformers(hotpot.read_mol('CCO', 'smi'), options=rdWrappers.ETKDGOptions(seed=123));
            assert sample.status is rdWrappers.GenerationStatus.SUCCESS;
            assert sample.coordinates.shape == (1, 3, 3)"
            && python -c "from rdkit import Chem, rdBase;
            import importlib.metadata;
            import hotpot;
            molecule = hotpot.Molecule();
            atom = molecule.create_atom(atomic_number=6);
            probe = Chem.MolFromSmiles('C[C@H](O)F');
            assert atom.atomic_number == 6;
            assert Chem.MolToSmiles(probe, isomericSmiles=True) == 'C[C@H](O)F';
            assert rdBase.rdkitVersion == '2026.09.1';
            assert importlib.metadata.version('rdkit') == '2026.9.1'"
      - name: Audit wheel contents
        run: python tests/test_packaging/audit_rdwrapper_wheel.py wheelhouse/*.whl
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python-tag }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hotpot-zzy
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
