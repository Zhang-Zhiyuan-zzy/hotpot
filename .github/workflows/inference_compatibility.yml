name: Inference compatibility

on:
  pull_request:
    paths:
      - "README.md"
      - "hotpot/cheminfo/AImodels/artifacts/**"
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/calculator/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/forcefields/**"
      - "hotpot/cheminfo/geometry/**"
      - "hotpot/cheminfo/graph/**"
      - "hotpot/cheminfo/obWrappers/**"
      - "hotpot/works/convert.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/pipeline/**"
      - "hotpot/plugins/_harness/**"
      - "hotpot/plugins/xtb/**"
      - "hotpot/__init__.py"
      - "hotpot/__main__.py"
      - "hotpot/_cli.py"
      - "hotpot/utils/configs/logging_config.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/calculator/**"
      - "tests/test_cheminfo/test_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_geometry*.py"
      - "tests/test_cheminfo/geometry/**"
      - "tests/test_cheminfo/graph/**"
      - "tests/test_cheminfo/obWrappers/**"
      - "tests/test_cheminfo/test_forcefield*.py"
      - "tests/test_cheminfo/test_complex*.py"
      - "tests/test_cheminfo/test_topology_determinism.py"
      - "tests/test_works/**"
      - "tests/test_cli/test_run_cli.py"
      - "tests/test_cli/test_xtb_cli.py"
      - "tests/test_main/test_command_loading.py"
      - "tests/test_pipeline/**"
      - "tests/test_plugin/test_harness/**"
      - "tests/test_plugin/test_xtb/**"
      - "tests/benchmarks/coordination_complexes/**"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "tests/run_coverage.sh"
      - "tests/readme/test_readme_examples.py"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  push:
    branches:
      - "**"
    paths:
      - "README.md"
      - "hotpot/cheminfo/AImodels/artifacts/**"
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/calculator/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/forcefields/**"
      - "hotpot/cheminfo/geometry/**"
      - "hotpot/cheminfo/graph/**"
      - "hotpot/cheminfo/obWrappers/**"
      - "hotpot/works/convert.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/pipeline/**"
      - "hotpot/plugins/_harness/**"
      - "hotpot/plugins/xtb/**"
      - "hotpot/__init__.py"
      - "hotpot/__main__.py"
      - "hotpot/_cli.py"
      - "hotpot/utils/configs/logging_config.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/calculator/**"
      - "tests/test_cheminfo/test_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_geometry*.py"
      - "tests/test_cheminfo/geometry/**"
      - "tests/test_cheminfo/graph/**"
      - "tests/test_cheminfo/obWrappers/**"
      - "tests/test_cheminfo/test_forcefield*.py"
      - "tests/test_cheminfo/test_complex*.py"
      - "tests/test_cheminfo/test_topology_determinism.py"
      - "tests/test_works/**"
      - "tests/test_cli/test_run_cli.py"
      - "tests/test_cli/test_xtb_cli.py"
      - "tests/test_main/test_command_loading.py"
      - "tests/test_pipeline/**"
      - "tests/test_plugin/test_harness/**"
      - "tests/test_plugin/test_xtb/**"
      - "tests/benchmarks/coordination_complexes/**"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "tests/run_coverage.sh"
      - "tests/readme/test_readme_examples.py"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-inference:
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            python-tag: cp310
          - python-version: "3.11"
            python-tag: cp311
          - python-version: "3.12"
            python-tag: cp312
          - python-version: "3.13"
            python-tag: cp313
          - python-version: "3.14"
            python-tag: cp314

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}
      - name: Download the wheel built for this Python
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.python-tag }}
          path: wheelhouse
      - name: Install compatibility runner
        run: python -m pip install uv
      - name: Test maintained inference and graph-search matrix
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_TEST_WORKDIR: ${{ runner.temp }}/hotpot-tests
        run: |
          HOTPOT_TEST_WHEEL=$(find wheelhouse -name '*.whl' -print -quit)
          export HOTPOT_TEST_WHEEL
          mkdir -p "$HOTPOT_TEST_WORKDIR"
          ./tests/run_inference_compatibility.sh "${{ matrix.python-version }}"

  native-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-tag: [cp310, cp311, cp312, cp313, cp314]

    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test the native wheel
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_BUILD: ${{ matrix.python-tag }}-manylinux_x86_64
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: >-
            quay.io/pypa/manylinux_2_28_x86_64@sha256:39df0042d5cc900b085aa25a0659368b42a0006c54c474299b785b44c1b4ff82
          CIBW_CONTAINER_ENGINE: >-
            docker; disable_host_mount: true
          CIBW_ENVIRONMENT_LINUX: >-
            HOTPOT_RDWRAPPERS_BUILD_PROFILE=manylinux_2_28_x86_64
            HOTPOT_RDKIT_SOURCE_CACHE=/tmp/hotpot-rdkit-source-cache
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair
            --exclude libopenbabel.so.7
            --exclude libopenbabel.so.8
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: >-
            python -c "import hotpot;
            from hotpot.cheminfo.geometry import _geometry_native;
            from hotpot.cheminfo.graph import GraphSpectrum, relevant_cycles;
            from hotpot.cheminfo.search import _search_native;
            from hotpot.cheminfo.obWrappers import _ob_native;
            from hotpot.cheminfo import rdWrappers;
            assert GraphSpectrum is not None;
            assert _geometry_native is not None and _ob_native is not None;
            assert _search_native.NativeProblem is not None;
            assert tuple(h.atom_indices for h in hotpot.read_mol('CCO', 'smi').search_substructure('[C]-[O]')) == (frozenset((1, 2)),);
            assert relevant_cycles([(4, 7), (7, 9), (9, 4)]) == ((4, 7, 9),);
            info = rdWrappers.runtime_info();
            assert info.native and info.rdkit_version == '2026.09.1'"
      - name: Audit wheel contents
        run: python tests/test_packaging/audit_rdwrapper_wheel.py wheelhouse/*.whl
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python-tag }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  package-smoke:
    needs: native-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}
      - name: Download the CPython 3.11 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-cp311
          path: wheelhouse
      - name: Install build and inference dependencies
        run: python -m pip install build -r tests/requirements-inference.txt
      - name: Build distributions and install wheel
        run: |
          python -m build --sdist
          python - <<'PY'
          from pathlib import Path
          import tarfile

          expected = {
              "hotpot/_cli.py",
              "hotpot/pipeline/cli.py",
              "hotpot/pipeline/cli_doc.md",
              "hotpot/cheminfo/forcefields/cli.py",
              "hotpot/cheminfo/forcefields/cli_doc.md",
              "hotpot/cheminfo/forcefields/__init__.py",
              "hotpot/cheminfo/forcefields/ff.py",
              "hotpot/cheminfo/calculator/execution_selection.py",
              "hotpot/cheminfo/calculator/state_rules/data/profiles/coordination_screening_v1.json",
              "hotpot/cheminfo/search/_search_native.pyi",
              "hotpot/cheminfo/graph/_graph_native.pyi",
              "hotpot/cheminfo/graph/_native/graph.cpp",
              "hotpot/cheminfo/graph/_native/graph.hpp",
              "hotpot/cheminfo/graph/_native/cycle_basis.cpp",
              "hotpot/cheminfo/graph/_native/cycle_basis.hpp",
              "hotpot/cheminfo/search/_native/bindings.cpp",
              "hotpot/cheminfo/search/_native/compatibility.hpp",
              "hotpot/cheminfo/search/_native/matcher.cpp",
              "hotpot/cheminfo/search/_native/matcher.hpp",
              "hotpot/cheminfo/search/_native/production.cpp",
              "hotpot/cheminfo/search/_native/production.hpp",
              "hotpot/plugins/xtb/cli.py",
              "hotpot/plugins/xtb/cli_doc.md",
              "hotpot/plugins/xtb/README.md",
              "hotpot/plugins/xtb/stage.py",
              "hotpot/plugins/xtb/workflow.py",
              "hotpot/pipeline/README.md",
              "hotpot/pipeline/state_recovery.py",
          }
          obsolete = {
              "hotpot/cheminfo/forcefields/ff39.py",
              "hotpot/cheminfo/forcefields/utils.py",
              "hotpot/cheminfo/forcefields/utils39.py",
              "hotpot/cheminfo/_io/xtb.py",
              "hotpot/plugins/xtb/core.py",
              "hotpot/plugins/xtb/xtb_doc.md",
              "hotpot/cheminfo/search/_native/graph_data.cpp",
              "hotpot/cheminfo/search/_native/graph_data.hpp",
          }
          (sdist,) = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              members = {
                  "/".join(Path(name).parts[1:])
                  for name in archive.getnames()
              }
          assert expected <= members
          assert obsolete.isdisjoint(members)
          PY
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
      - name: Install and verify inference models
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all
      - name: Smoke-test installed core and documentation
        working-directory: /tmp
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          core
      - name: Smoke-test installed inference
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          inference
      - name: Smoke-test installed force-field workflows
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          forcefield

  coverage:
    needs: package-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}
      - name: Download the CPython 3.11 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-cp311
          path: wheelhouse
      - name: Install the tested wheel and coverage dependencies
        run: |
          python -m pip install 'coverage>=7,<8' -r tests/requirements-inference.txt
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
          python -m pip check
      - name: Install and verify inference models
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all
      - name: Run maintained tests with coverage
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
          HOTPOT_TEST_WORKDIR: ${{ runner.temp }}/hotpot-tests
        run: ./tests/run_coverage.sh
      - name: Annotate test failures
        if: ${{ failure() && hashFiles('tests/coverage/junit.xml') != '' }}
        run: python tests/annotate_junit.py tests/coverage/junit.xml
      - name: Upload coverage reports to Codecov
        if: ${{ always() && hashFiles('tests/coverage/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./tests/coverage/coverage.xml
          use_oidc: true
