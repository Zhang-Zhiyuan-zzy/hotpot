package:
  name: hotpot
  version: 0.5.0.0

source:
  path: ./hotpot

build:
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  build:
    - python >=3.10,<3.15
    - setuptools
    - openbabel
    - lammps
    - cclib
  host:
    - python >=3.10,<3.15
    - pip
  run:
    - python >=3.10,<3.15
    - openbabel
    - rdkit ==2026.09.1
    - cclib
    - lammps
