name: Diagnose installed inference smoke

on:
  push:
    branches:
      - fix/github-workflows

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    outputs:
      mca_sites: ${{ steps.mca.outputs.sites }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Download the previously validated CPython 3.11 wheel
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40445318302
          name: wheel-cp311
          path: wheelhouse
      - name: Install wheel and inference dependencies
        run: |
          python -m pip install -r tests/requirements-inference.txt
          python -m pip install --no-deps --force-reinstall wheelhouse/*.whl
      - name: Cache inference models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hotpot-models
          key: ${{ runner.os }}-hotpot-models-v2-${{ hashFiles('hotpot/cheminfo/AImodels/mca/models/manifest.json', 'hotpot/cheminfo/AImodels/cbond/onnx/manifest.json') }}
      - name: Install inference models
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
        run: hotpot models install --all
      - name: Read MCA prediction
        id: mca
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: |
          sites=$(python -c 'import hotpot; from hotpot.cheminfo.AImodels.mca import MCAPredictor; prediction = MCAPredictor(device="cpu").predict(hotpot.to_hotpot_mol("C1CCCCN1")); print(";".join(f"{site.atom_index}:{site.mca_kj_mol:.12f}" for site in prediction.sites))' 2>&1 || true)
          sites=$(printf '%s\n' "$sites" | tail -1 | tr -d '\r')
          echo "sites=$sites" >> "$GITHUB_OUTPUT"
      - name: CBond smoke
        working-directory: /tmp
        env:
          HOTPOT_MODEL_HOME: ${{ runner.temp }}/hotpot-models
          HOTPOT_MODEL_SOURCE: local
        run: >-
          python
          "${{ github.workspace }}/tests/test_packaging/installed_package_smoke.py"
          cbond

  report:
    needs: diagnose
    if: ${{ always() }}
    name: MCA ${{ needs.diagnose.outputs.mca_sites }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"
