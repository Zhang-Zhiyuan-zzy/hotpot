name: Inference compatibility

on:
  pull_request:
    paths:
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/forcefields.py"
      - "hotpot/cheminfo/geometry/**"
      - "hotpot/works/convert.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/cheminfo/calculator.py"
      - "hotpot/calculator.py"
      - "hotpot/__init__.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_geometry*.py"
      - "tests/test_cheminfo/geometry/**"
      - "tests/test_cheminfo/test_forcefield*.py"
      - "tests/test_cheminfo/test_complex*.py"
      - "tests/test_cheminfo/test_topology_determinism.py"
      - "tests/test_works/**"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "tests/run_coverage.sh"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  push:
    paths:
      - "hotpot/cheminfo/AImodels/mca/**"
      - "hotpot/cheminfo/AImodels/cbond/**"
      - "hotpot/cheminfo/search/**"
      - "hotpot/cheminfo/convert.py"
      - "hotpot/cheminfo/__init__.py"
      - "hotpot/cheminfo/_io/**"
      - "hotpot/cheminfo/core.py"
      - "hotpot/cheminfo/core_utils.py"
      - "hotpot/cheminfo/forcefields.py"
      - "hotpot/cheminfo/geometry/**"
      - "hotpot/works/convert.py"
      - "hotpot/cheminfo/rdconvert.py"
      - "hotpot/cheminfo/obconvert.py"
      - "hotpot/cheminfo/ob2chem.py"
      - "hotpot/cheminfo/calculator.py"
      - "hotpot/calculator.py"
      - "hotpot/__init__.py"
      - "hotpot/utils/types.py"
      - "tests/mca/**"
      - "tests/cbond/**"
      - "tests/test_cheminfo/test_mca_calculator.py"
      - "tests/test_cheminfo/test_molecule_conversion.py"
      - "tests/test_cheminfo/test_ob2chem_compat.py"
      - "tests/test_cheminfo/test_bond_metadata.py"
      - "tests/test_cheminfo/test_ligand_rings.py"
      - "tests/test_cheminfo/test_geometry*.py"
      - "tests/test_cheminfo/geometry/**"
      - "tests/test_cheminfo/test_forcefield*.py"
      - "tests/test_cheminfo/test_complex*.py"
      - "tests/test_cheminfo/test_topology_determinism.py"
      - "tests/test_works/**"
      - "tests/test_cheminfo/test_search*.py"
      - "tests/test_smart_parser.py"
      - "tests/smarts_conformance/**"
      - "tests/requirements-inference.txt"
      - "tests/run_inference_compatibility.sh"
      - "tests/run_coverage.sh"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - ".github/workflows/inference_compatibility.yml"
  workflow_dispatch:

jobs:
  cpu-inference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install compatibility runner
        run: python -m pip install uv
      - name: Test maintained inference and graph-search matrix
        run: ./tests/run_inference_compatibility.sh "${{ matrix.python-version }}"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and inference dependencies
        run: python -m pip install build -r tests/requirements-inference.txt
      - name: Build and install wheel
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Smoke-test installed package outside the checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          import subprocess

          import hotpot
          from hotpot.cheminfo.AImodels.mca import MCAPredictor

          documentation = subprocess.run(
              ["hotpot", "mca", "--doc"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "hotpot mca" in documentation
          assert "Command synopsis" in documentation

          molecule = hotpot.to_hotpot_mol("C1CCCCN1")
          prediction = MCAPredictor(device="cpu").predict(molecule)
          assert len(prediction.atom_predictions) == 6
          assert abs(prediction.sites[0].mca_kj_mol - 503.25) < 1e-6

          cbond_result = subprocess.run(
              ["hotpot", "cbond", "Eu", "CN", "--device", "cpu"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          assert "[Eu" in cbond_result
          assert len(cbond_result.splitlines()) == 1

          cbond_documentation = subprocess.run(
              ["hotpot", "cbond", "--doc"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "hotpot cbond" in cbond_documentation
          assert "Enumerate terminal coordination structures" in cbond_documentation
          assert "default mode must not be interpreted as an alias for Rank 1" in cbond_documentation

          cbond_ranked = subprocess.run(
              [
                  "hotpot", "cbond", "Eu", "CN", "--device", "cpu",
                  "--all-structures", "--bond-detail",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          assert "Rank 1: Prob:" in cbond_ranked
          assert "Cbond Detail:" in cbond_ranked
          assert cbond_ranked.rstrip().endswith("-- End --")
          PY
